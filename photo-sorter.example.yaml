# Copy to photo-sorter.yaml and edit the paths.
# CLI flags override anything set here.
#
#   photo-sorter run
#   photo-sorter -c photo-sorter.yaml run
#   photo-sorter run --input /other/disk

# Resume a previous workspace without redoing earlier stages:
# from_phase: metadata   # backup | sort | dedup | enhance | metadata | index (or 0-5)
# faces_only: true       # re-run face detection/recognition on existing metadata JSON only

verbose: false

paths:
  input: /path/to/photos
  archive: ./backup.tar.gz
  output: ./work
  discard: ./work/discarded
  face_samples: ./samples
  # Used by index/search to resolve picture files
  images: ./work/enhanced
  metadata: ./work/metadata

dedup:
  enable_manual_selection: false

enhance:
  quality_threshold: 0.75
  apply_color_correction: false
  # false/null to skip; true means medium; or light | medium | strong
  # upscaling also accepts ml (Real-ESRGAN; run photo-sorter pull-models first)
  apply_denoising: medium
  apply_sharpening: light
  apply_artifact_removal: true
  apply_upscaling: ml

ml:
  # Used by pull-models and metadata/run. First fetch goes to ~/.cache/photo-sorter/models/
  yolo_model: yolov8n.pt

search:
  es_url: http://localhost:9200
  es_index: photos
  query: ""
  person: null
  object: null
  from: null
  to: null
  limit: 10
